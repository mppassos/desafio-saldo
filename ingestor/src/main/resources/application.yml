spring:
  application:
    name: ingestor
  datasource:
    url: jdbc:postgresql://localhost:5432/saldo_db
    username: admin
    password: admin123
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

aws:
  sqs:
    region: sa-east-1
    endpoint: http://localhost:4566
    queue-name: transacoes-financeiras-processadas
    access-key: test
    secret-key: test

ingestor:
  batch-size: 10
  wait-time-seconds: 5
  visibility-timeout: 30
  poll-interval-ms: 1000
  initial-delay-ms: 5000
  scheduling:
    enabled: true

resilience4j:
  retry:
    instances:
      sqsConsumer:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialMaxWaitDuration: 10s
        retryExceptions:
          - org.springframework.dao.DataAccessException
          - software.amazon.awssdk.services.sqs.model.SqsException
  circuitbreaker:
    instances:
      sqsConsumer:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  level:
    com.itau.ingestor: INFO
